
{% extends 'base.html' %}

{% block title %}
    Sign Up | Coffee Shop
{% endblock %}

{% block content %}

<div class="signup-container">

    <h2>Create Your Account</h2>
    <p>Join our Coffee Shop community!</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="form-fields">
            {{ form.as_p }}
        </div>

        <button type="submit">Create Account</button>
    </form>

    <p class="login-link">
        Already have an account?
        <a href="{% url 'Base_Home' %}">Login</a>
    </p>

</div>

{% endblock %}
