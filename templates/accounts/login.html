
{% extends 'base.html' %}

{% block title %}
    Login | Coffee Shop
{% endblock %}

{% block content %}

<div class="login-container">

    <h2>Welcome Back!</h2>
    <p>Login to your Coffee Shop account.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'accounts' %}">Sign Up</a>
    </p>

</div>

{% endblock %}
